# Reference cleanliness contract for WaveNetworks/child-app
# =========================================================
# child-app is the GENERIC reference scaffold for the Wave Networks platform.
# It must never carry tenant/app-specific domain logic or identity. This file
# declares what "clean" means; scan_reference_contamination.py enforces it and
# the contamination-guard CI workflow fails the build on any Tier 1/2 violation.
#
# Maintained by the nokemo "Reference Harvest & Sync" process.
# Docs: nokemo/docs/reference-maintenance.md
#
# This is the TEMPLATE that lives in nokemo. The live copy is committed to
# child-app as `.reference-clean.yml` (Phase 1). Keep the two in sync, or have
# child-app's copy be the source of truth and this one the seed.

version: 1

# ---------------------------------------------------------------------------
# TIER 1 — app-identity tokens.  ZERO TOLERANCE → hard fail.
# Slugs/brand names of monitored/tenant apps. These must NEVER appear anywhere
# in the generic reference. This is the single rule that would have caught the
# "Add all ElevateHER app features" merge. Keep in sync with the registered_app
# registry (harvest_app_features.py can regenerate this list).
# ---------------------------------------------------------------------------
forbidden_tokens:
  - elevateher
  - elevate her         # spelled-out brand (spaced) — catches marketing/onboarding copy
  - dswa                # elevateHER production domain
  - direct selling women # DSWA spelled out — the exact onboarding copy Tier 1 missed (verified hard-fail)
  - sisterhood          # elevateHER community framing
  - lotus               # elevateHER brand motif
  - pwt
  - hireasupport
  # NOTE: do not list the parent platform ("wave", "subtheme") or "nokemo";
  # those legitimately appear in the scaffold.

# ---------------------------------------------------------------------------
# TIER 2a — forbidden files/paths (the known app-specific domain surface).
# Presence of any of these → hard fail. This list is the explicit cleanup
# target: as the reference is stripped back to generic scaffold, these should
# all disappear. Globs are relative to repo root; ** spans directories.
# ---------------------------------------------------------------------------
forbidden_paths:
  # explicit elevateHER artifacts
  - "docker/generate-elevateher-config.php"
  - "assets/themes/dswa/**"
  - "assets/js/explorer-view.js"
  - "assets/js/lotus-canvas.js"
  - "EXPLORER_SPEC.md"
  - "FRAMEWORK_UPDATE_PROMPT.md"
  - "QUESTION_GAP_DETECTION.md"
  # assessment / coaching / framework / content engine (elevateHER domain)
  - "include/common/assessmentHelpers.php"
  - "include/common/scoringEngine.php"
  - "include/common/questionMatrixHelpers.php"
  - "include/common/coachHelpers.php"
  - "include/common/cohortProgressHelpers.php"
  - "include/common/frameworkHelpers.php"
  - "include/common/frameworkSync.php"
  - "include/common/contentHelpers.php"
  - "include/common/contentFileHelpers.php"
  - "include/common/proposalHelpers.php"
  - "include/common/progressHelpers.php"
  - "include/common/instanceFileHelpers.php"
  - "include/actions/memberActions/assessmentActions.php"
  - "include/actions/memberActions/coachNoteActions.php"
  - "include/actions/memberActions/frameworkActions.php"
  - "include/actions/memberActions/contentActions.php"
  - "include/actions/memberActions/proposalActions.php"
  - "include/actions/memberActions/relationshipActions.php"
  - "include/actions/apiActions/assessmentApiActions.php"
  - "include/actions/apiActions/contentApiActions.php"
  - "include/actions/apiActions/teamApiActions.php"
  - "views/assessment.php"
  - "views/coaches.php"
  - "views/cohort.php"
  - "views/content.php"
  - "views/content_detail.php"
  - "views/admin_content.php"
  - "views/admin_framework.php"
  - "views/admin_proposals.php"
  - "views/admin_stages.php"
  - "views/results.php"
  - "views/game.php"
  - "views/team.php"

# ---------------------------------------------------------------------------
# TIER 2b — forbidden DB tables (app-specific). Matched against `CREATE TABLE`
# statements in db_migrations/**. Presence → hard fail. Glob patterns.
# ---------------------------------------------------------------------------
forbidden_tables:
  - "assessment_*"
  - "coach_*"
  - "cohort_*"
  - "framework_*"
  - "content_chat_log"
  - "content_guide_cache"
  - "content_progress"
  - "progress_snapshots"
  - "session_notes"

# ---------------------------------------------------------------------------
# TIER 3 — domain-term heuristics. Advisory (warn, do NOT fail) unless --strict.
# These catch *new* domain logic creeping in even when it avoids app names.
# Tune to reduce false positives; they are signals, not gates.
# ---------------------------------------------------------------------------
warn_tokens:
  - assessment
  - scoring
  - cohort
  - coaching
  - "framework proposal"
  - explorer
  - "question matrix"

# ---------------------------------------------------------------------------
# Paths never scanned.
# ---------------------------------------------------------------------------
ignore_paths:
  - ".git/**"
  - "node_modules/**"
  - "vendor/**"
  - "**/*.min.js"
  - "package-lock.json"
  - ".reference-clean.yml"
  # The scanner and its CI workflow legitimately name app-identity tokens in
  # docstrings/comments to explain what they enforce. Exclude them so the guard
  # never trips on its own tooling (same reason .reference-clean.yml is ignored).
  - "scripts/scan_reference_contamination.py"
  - ".github/workflows/contamination-guard.yml"
