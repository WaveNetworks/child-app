# Reference-contamination guard
# ==============================
# child-app is the GENERIC reference scaffold for the Wave Networks platform.
# It must never carry tenant/app-specific domain logic or identity. This guard
# runs scan_reference_contamination.py against the cleanliness contract
# (.reference-clean.yml at the repo root) on every push and pull request.
#
# MODE: full hard gate with --strict (no --baseline). All tiers — Tier 1/2a/2b
# (app-identity tokens, forbidden files, forbidden CREATE TABLE) AND Tier 3
# (domain-vocabulary heuristics) — have been driven to 0, so the guard FAILS the
# build on any newly introduced contamination at any tier. Re-check locally with:
#     python3 scripts/scan_reference_contamination.py --target . --strict
#
# Part of the nokemo "Reference Harvest & Sync" process.
name: contamination-guard

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Scan for reference contamination
        # --strict also gates Tier 3 (domain vocabulary). Enabled 2026-07-10 once
        # the restored reference reached CLEAN on all tiers (T1/T2a/T2b/T3 = 0).
        run: python3 scripts/scan_reference_contamination.py --target . --strict
