# docker-compose.yml — generic Wave Networks child app dev stack.
#
# Set CHILD_APP_SLUG (lowercase, URL-safe) and CHILD_APP_NAME in your
# .env file. Every database name + path below is derived from
# CHILD_APP_SLUG via env interpolation, so a new child app gets its
# own namespaced DBs without editing this file.
#
# .env example:
#   CHILD_APP_SLUG=myapp
#   CHILD_APP_NAME=My App
#   ANTHROPIC_API_KEY=sk-ant-...
#
# Single MySQL server hosts all 6 namespaced databases.
# Source is BIND-MOUNTED from the host — edit files and refresh, no rebuild needed.

services:
  app:
    build:
      context: .
    ports:
      - "8085:80"
    env_file:
      - ../../.env
    environment:
      - ENVIRONMENT=development
      - CHILD_APP_SLUG=${CHILD_APP_SLUG:-child-app}
      - CHILD_APP_NAME=${CHILD_APP_NAME:-Wave Networks Child App}
      # Admin databases — namespaced by child app slug
      - DB_HOST_MAIN=db
      - DB_NAME_MAIN=${CHILD_APP_SLUG:-child_app}_admin_main
      - DB_USER=root
      - DB_PASSWORD=dev_root_password_123
      - DB_HOST_SHARD=db
      - DB_NAME_SHARD=${CHILD_APP_SLUG:-child_app}_admin_shard_1
      - DB_HOST_SHARD2=db
      - DB_NAME_SHARD2=${CHILD_APP_SLUG:-child_app}_admin_shard_2
      - FILES_LOCATION=/var/www/files/
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - MAIL_FROM=noreply@localhost
      - MAIL_FROM_NAME=${CHILD_APP_NAME:-Wave Networks Child App}
      - APP_SECRET=dev_app_secret_64_chars_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - HIDDEN_HASH=dev_hidden_hash_xxxxxxxxxxxxxxxxxx
      - SEED_TEST_DATA=true
      # Child-app databases — namespaced by child app slug
      - CHILD_DB_HOST=db
      - CHILD_DB_NAME=${CHILD_APP_SLUG:-child_app}_main
      - CHILD_DB_USER=root
      - CHILD_DB_PASS=dev_root_password_123
      - CHILD_DB_HOST_SHARD=db
      - CHILD_DB_NAME_SHARD=${CHILD_APP_SLUG:-child_app}_shard_1
      - CHILD_DB_HOST_SHARD2=db
      - CHILD_DB_NAME_SHARD2=${CHILD_APP_SLUG:-child_app}_shard_2
      # Optional AI / framework config — only relevant if the app
      # uses AI assistance and an external framework JSON tree
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CHILD_APP_AI_MODEL=${CHILD_APP_AI_MODEL:-claude-sonnet-4-6}
      - CHILD_APP_FRAMEWORK_SOURCE=${CHILD_APP_FRAMEWORK_SOURCE:-local}
      - CHILD_APP_FRAMEWORK_PATH=${CHILD_APP_FRAMEWORK_PATH:-/var/www/public_html/framework-data/framework}
      - CHILD_APP_URL=${CHILD_APP_URL:-http://localhost:8085/${CHILD_APP_SLUG:-child-app}/app}
    volumes:
      # Source code — bind-mounted for live editing (no rebuild needed)
      - ../admin:/var/www/public_html/admin
      - .:/var/www/public_html/${CHILD_APP_SLUG:-child-app}
      # Optional: mount a sibling framework / demo content tree if the
      # app uses one. Comment these out if not needed.
      # - ../framework-data:/var/www/public_html/framework-data
      # - ../content-demo:/var/www/public_html/content-demo
      # Persistent data
      - files_vol:/var/www/files
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_password_123
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

volumes:
  files_vol:
  db_data:
