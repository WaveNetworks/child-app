# docker-compose.yml — ElevateHER Learning Suite
#
# Single MySQL server hosts all 6 namespaced databases.
# Source is BIND-MOUNTED from the host — edit files and refresh, no rebuild needed.

services:
  app:
    build:
      context: .
    ports:
      - "8085:80"
    env_file:
      - ../../.env
    environment:
      - ENVIRONMENT=development
      # Admin databases
      - DB_HOST_MAIN=db
      - DB_NAME_MAIN=elevateher_admin_main
      - DB_USER=root
      - DB_PASSWORD=dev_root_password_123
      - DB_HOST_SHARD=db
      - DB_NAME_SHARD=elevateher_admin_shard_1
      - DB_HOST_SHARD2=db
      - DB_NAME_SHARD2=elevateher_admin_shard_2
      - FILES_LOCATION=/var/www/files/
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - MAIL_FROM=noreply@localhost
      - MAIL_FROM_NAME=ElevateHER
      - APP_SECRET=dev_app_secret_64_chars_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - HIDDEN_HASH=dev_hidden_hash_xxxxxxxxxxxxxxxxxx
      - SEED_TEST_DATA=true
      # ElevateHER child app databases
      - CHILD_DB_HOST=db
      - CHILD_DB_NAME=elevateher_main
      - CHILD_DB_USER=root
      - CHILD_DB_PASS=dev_root_password_123
      - CHILD_DB_HOST_SHARD=db
      - CHILD_DB_NAME_SHARD=elevateher_shard_1
      - CHILD_DB_HOST_SHARD2=db
      - CHILD_DB_NAME_SHARD2=elevateher_shard_2
      # ElevateHER app config
      - ELEVATEHER_AI_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVATEHER_AI_MODEL=claude-sonnet-4-20250514
      - ELEVATEHER_FRAMEWORK_SOURCE=local
      - ELEVATEHER_FRAMEWORK_PATH=/var/www/public_html/dswa-framework/framework
      - ELEVATEHER_APP_URL=http://localhost:8085/elevateher/app
    volumes:
      # Source code — bind-mounted for live editing (no rebuild needed)
      - ../admin:/var/www/public_html/admin
      - .:/var/www/public_html/elevateher
      - ../dswa-framework:/var/www/public_html/dswa-framework
      - ../DSWADemo:/var/www/public_html/DSWADemo
      # Persistent data
      - files_vol:/var/www/files
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_password_123
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

volumes:
  files_vol:
  db_data:
